# Blueprint do Render (https://render.com). Crie com: Dashboard → New → Blueprint → este repositório.
services:
  - type: web
    name: prospecta
    runtime: docker
    plan: starter            # necessário para o disco persistente (banco e uploads)
    healthCheckPath: /api/health
    disk:
      name: prospecta-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HUB_PASSWORD     # senha de acesso ao Hub (obrigatória)
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AGENCY_NAME
        value: Prospecta
      - key: OSM_CONTACT_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY  # opcional
        sync: false
      - key: GOOGLE_PLACES_API_KEY  # opcional
        sync: false
